version: '3.8'

# Secrets come from a root .env file (git-ignored) — see .env.example.
# POSTGRES_PASSWORD and JWT_SECRET have no default on purpose: compose fails
# loudly instead of silently starting with a known password.

services:
  postgres:
    image: postgres:16-alpine
    container_name: flex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flexdb}
      POSTGRES_USER: ${POSTGRES_USER:-flex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - flex-network

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flex-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flex}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-flexdb}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:-https://veheys.online}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    networks:
      - flex-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: flex-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    volumes:
      - ./ssl:/etc/nginx/ssl
    networks:
      - flex-network

networks:
  flex-network:
    driver: bridge

volumes:
  postgres_data:
