# Flex — API в docker.
#
# PostgreSQL здесь НЕТ намеренно. Он уже запущен как отдельный контейнер
# flex-postgres (создан через docker run, без compose-меток) и хранит данные в
# томе flex_data. Если объявить сервис postgres в этом файле, compose попытается
# создать свой контейнер с другим именем — либо упрётся в конфликт имён, либо,
# что хуже, поднимет пустую базу на томе postgres_data. Поэтому compose
# управляет только API, а к БД идёт через опубликованный порт хоста.
#
# nginx и TLS остаются на хосте: 443 занят xray. Статику клиента копирует
# деплой в /var/www/html.
#
# Готовность БД обеспечивается не healthcheck'ом compose, а повторными
# попытками подключения в server/src/index.ts — это работает одинаково
# независимо от того, кто запустил процесс.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flex-server
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      # host.docker.internal вместо имени сервиса: БД живёт вне compose.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-flex}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB:-flexdb}?schema=public"
      NODE_ENV: production
    extra_hosts:
      # host-gateway резолвится в IP хоста, чтобы контейнер достучался до
      # опубликованного на хосте порта 5432.
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only. Publishing on every interface let anyone reach the API
      # directly and send their own X-Forwarded-For, which with trust proxy = 1
      # is trusted, so they could pick their own rate-limit bucket and bypass
      # every limiter. nginx runs on the host and reaches 127.0.0.1:3001.
      #
      # The deploy verifies nginx can still reach the API and reverts this
      # automatically if not, so it cannot silently take the site offline.
      - "127.0.0.1:3001:3001"
    volumes:
      # Загруженные файлы в образе живут только до пересборки — без этого
      # аватары и картинки в заметках/чатах пропадают при каждом деплое.
      - ./server/uploads:/app/uploads

networks:
  default:
    driver: bridge
