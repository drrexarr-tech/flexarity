# Flex — контейнерная часть.
#
# Что где живёт:
#   postgres — БД (docker, restart: unless-stopped)
#   server   — API (docker, restart: unless-stopped, порт 3001 наружу)
#
# nginx и TLS остаются НА ХОСТЕ намеренно: порт 443 занят xray
# (tls-терминатор, проксирует на nginx), поэтому контейнер клиента
# не может подняться на 80/443. Статику клиента деплой копирует в
# /var/www/html, хостовый nginx отдаёт её сам.
#
# Секреты — из server/.env, который деплой экспортирует в окружение:
# так работают и Compose v1, и v2 (флаг --env-file есть только у v2).
# В самом файле тоже задан env_file, поэтому контейнер получает все
# переменные приложения независимо от интерполяции.
#
# version: 2.4 — из-за отсутствия сети с собственным именем и ради
# совместимости с установленным Compose; v2 это поле просто игнорирует.

version: "2.4"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flexdb}
      POSTGRES_USER: ${POSTGRES_USER:-flex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Без healthcheck compose считает контейнер готовым сразу после старта,
    # и API падает при первом же подключении, если БД ещё инициализируется.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flex} -d ${POSTGRES_DB:-flexdb}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: flex-server
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      # Внутри сети docker хост БД — имя сервиса, а не localhost.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-flex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flexdb}?schema=public"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      # Загруженные файлы живут в образе только до пересборки — без этого
      # монтирования аватары и картинки в заметках/чатах пропадают.
      - ./server/uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
