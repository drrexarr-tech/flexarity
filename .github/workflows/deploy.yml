name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: veheys.online
          username: flexdrrexar
          port: 8833
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # Deploy diagnostics.
            #
            # There is no shell access to this host, so when a deploy goes wrong
            # the only evidence is a log behind GitHub authentication, which is
            # not readable from here. On failure this dumps the state of the API
            # into the web root, which nginx serves, so the cause is fetchable
            # from https://veheys.online/_deploy.txt. Removed on success.
            deploy_diagnostics() {
              status=$?
              if [ "$status" -eq 0 ]; then
                sudo rm -f /var/www/html/_deploy.txt || true
                return 0
              fi
              {
                echo "deploy failed with exit $status at $(date -u +%FT%TZ)"
                echo "--- failing command ---"
                echo "line ${BASH_LINENO[0]}: ${BASH_COMMAND}"
                echo "--- phase trace ---"
                cat /tmp/_phase.log 2>/dev/null || echo "(none)"
                echo "--- health on localhost ---"
                curl -sS -m 5 http://localhost:3001/api/health || echo "(no response)"
                echo
                echo "--- listeners ---"
                sudo ss -tlnp 2>/dev/null | head -30 || true
                echo "--- compose ps ---"
                docker compose ps 2>&1 | head -20 || true
                echo "--- compose logs ---"
                docker compose logs --tail 60 server 2>&1 || true
                echo "--- screen sessions ---"
                screen -ls 2>&1 || true
                echo "--- last server build output ---"
                tail -40 /tmp/flex-build.log 2>/dev/null || echo "(not captured)"
              } > /tmp/_deploy.txt 2>&1 || true
              sudo mkdir -p /var/www/html || true
              sudo cp /tmp/_deploy.txt /var/www/html/_deploy.txt || true
              sudo chmod 644 /var/www/html/_deploy.txt || true
              exit "$status"
            }
            trap deploy_diagnostics EXIT

            # Records the phase the script was in when it failed. Two deploys died
            # with exit 255 while the API was healthy, and a healthy container
            # that is 35 minutes old means the failure was before `docker compose
            # up` - but nothing said which command.
            phase() { echo "$(date +%s) $1" >>/tmp/_phase.log; }
            : >/tmp/_phase.log
            phase "start"

            cd /opt/flex

            if [ ! -f server/.env ]; then
              echo "ERROR: /opt/flex/server/.env not found (see server/.env.example)"
              exit 1
            fi

            echo "=== Checking the signing key ==="
            # The JWT secret in use was 20 characters and was committed to git
            # history, so it cannot be trusted. Rotated once, in place: the file
            # is gitignored and survives `git reset --hard`, so this runs on
            # every deploy and only acts while the value is still weak.
            current_secret=$(grep -E '^JWT_SECRET=' server/.env | head -1 | cut -d= -f2- || true)
            if [ ${#current_secret} -lt 32 ] || [ "${current_secret:-}" = "secret" ]; then
              fresh_secret=$(head -c 48 /dev/urandom | base64 | tr -d '\n=' | tr '/+' '_-')
              if grep -q '^JWT_SECRET=' server/.env; then
                sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${fresh_secret}|" server/.env
              else
                printf '\nJWT_SECRET=%s\n' "${fresh_secret}" >> server/.env
              fi
              chmod 600 server/.env
              echo "JWT_SECRET rotated (was ${#current_secret} chars, now ${#fresh_secret}); everyone must sign in again"
            else
              echo "JWT_SECRET is ${#current_secret} chars, left as is"
            fi

            echo "=== Loading secrets from server/.env ==="
            set -a
            . /opt/flex/server/.env
            set +a

            echo "=== Pulling latest code ==="
            git fetch origin && git reset --hard origin/main

            echo "=== Building client ==="
            phase "build client"
            cd /opt/flex/client
            # Same idea as the server: npm install is the slowest step when the
            # cache is cold, and most deploys do not change the dependency tree.
            client_lock=$(sha256sum package-lock.json | cut -d' ' -f1)
            if [ "$client_lock" != "$(cat /tmp/flex-client-lock 2>/dev/null)" ]; then
              npm install --silent
              echo "$client_lock" >/tmp/flex-client-lock
            else
              echo "client dependencies unchanged, skipping npm install"
            fi
            npm run build
            sudo cp -r dist/* /var/www/html/

            phase "stale asset cleanup"
            echo "=== Removing stale web assets ==="
            # Every build emits a new hashed bundle name, and nothing ever
            # deleted the old ones, so the web root grew by a full copy per
            # deploy.
            #
            # The previous version listed the files in dist/assets and then
            # checked each one for existence in dist/assets, which is true by
            # construction: it never deleted anything, and it still spent 57
            # seconds walking the tree. This lists what is actually deployed,
            # subtracts what the build produced, and deletes the difference in a
            # single sudo call.
            #
            # Only dist/assets and the workbox-* files are considered; anything
            # else in the web root must survive.
            if [ -d /opt/flex/client/dist/assets ]; then
              sudo find /var/www/html/assets -type f -printf '%f\n' 2>/dev/null | sort >/tmp/_deployed.txt
              ( cd /opt/flex/client/dist/assets && find . -type f -printf '%f\n' ) | sort >/tmp/_built.txt
              comm -23 /tmp/_deployed.txt /tmp/_built.txt >/tmp/_stale.txt || true
              # Only Vite's hashed outputs are candidates for deletion. Anything
              # else that lives in the web root - a logo, a template, an
              # index.nginx-debian.html - was never produced by this build and
              # must survive. Without this filter the cleanup removed every file
              # in assets that the build did not happen to emit.
              grep -E -- '-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$' /tmp/_stale.txt >/tmp/_stale_hashed.txt || true
              stale=$(wc -l </tmp/_stale_hashed.txt)
              if [ "$stale" -gt 0 ]; then
                while read -r name; do
                  [ -n "$name" ] && printf '/var/www/html/assets/%s\0' "$name"
                done </tmp/_stale_hashed.txt | sudo xargs -0 -r rm -f
                echo "removed $stale stale hashed asset(s)"
              else
                echo "no stale assets"
              fi
            fi
            sudo find /var/www/html -maxdepth 1 -name 'workbox-*.js' -type f -printf '%f\n' 2>/dev/null | sort >/tmp/_deployed_wb.txt
            ( cd /opt/flex/client/dist 2>/dev/null && find . -maxdepth 1 -name 'workbox-*.js' -printf '%f\n' ) | sort >/tmp/_built_wb.txt
            comm -23 /tmp/_deployed_wb.txt /tmp/_built_wb.txt >/tmp/_stale_wb.txt || true
            while read -r name; do
              [ -n "$name" ] && sudo rm -f "/var/www/html/$name"
            done </tmp/_stale_wb.txt

            phase "docker image prune"
            echo "=== Pruning dangling images ==="
            # Targets only untagged leftovers from previous builds.
            # `image prune -a` would delete the postgres image, which must
            # survive a server reboot.
            docker image prune -f >/dev/null 2>&1 || true

            echo "=== Ensuring uploads volume exists ==="
            mkdir -p /opt/flex/server/uploads

            cd /opt/flex/server

            echo "=== Prisma client and schema ==="
            phase "prisma generate and db push"
            # Installing and generating on the host is only needed to apply the
            # schema, and both are skipped when nothing relevant changed. Most
            # deploys touch neither.
            server_lock=$(sha256sum package-lock.json | cut -d' ' -f1)
            if [ "$server_lock" != "$(cat /tmp/flex-server-lock 2>/dev/null)" ]; then
              npm install --silent
              echo "$server_lock" >/tmp/flex-server-lock
            else
              echo "server dependencies unchanged, skipping npm install"
            fi
            npx prisma generate >/dev/null 2>&1

            schema_hash=$(sha256sum prisma/schema.prisma | cut -d' ' -f1)
            if [ "$schema_hash" != "$(cat /tmp/flex-schema-hash 2>/dev/null)" ]; then
              npx prisma db push --accept-data-loss
              echo "$schema_hash" >/tmp/flex-schema-hash
            else
              echo "schema unchanged, skipping db push"
            fi

            port_3001_busy() {
              # Capture into a variable instead of piping into grep: with
              # `set -o pipefail` an early-exiting grep can SIGPIPE ss,
              # turning a successful match into a non-zero pipeline and
              # reporting the port as free while it is still bound.
              local listeners
              listeners=$(sudo ss -tln 2>/dev/null || true)
              case "$listeners" in
                *:3001*) return 0 ;;
              esac
              return 1
            }

            release_port() {
              screen -X -S flex-server quit 2>/dev/null || true

              # Free the port by identifying whoever holds it, never by matching
              # a command pattern. `pkill -f "tsx watch"` terminated this script
              # itself, because the pattern also appears in the command line of
              # the shell running it — hence exit status 143 with no error text.
              for _ in $(seq 1 15); do
                if ! port_3001_busy; then return 0; fi
                sudo fuser -k -TERM 3001/tcp >/dev/null 2>&1 || true
                sleep 1
              done
              return 1
            }

            start_host() {
              # Only reached when the container path fails, so this is the one
              # place a host build is actually needed. Its output is captured so
              # a later failure has a trail.
              npm run build >/tmp/flex-build.log 2>&1 || {
                tail -40 /tmp/flex-build.log
                return 1
              }
              release_port || true
              screen -dmS flex-server bash -c 'cd /opt/flex/server && exec node dist/index.js'
            }

            wait_api() {
              for _ in $(seq 1 60); do
                if curl -fsS http://localhost:3001/api/health >/dev/null 2>&1; then
                  return 0
                fi
                sleep 1
              done
              return 1
            }

            if docker compose version >/dev/null 2>&1; then
              echo "=== Compose available: deploying API as a container ==="

              phase "compose build and restart"
              cd /opt/flex
              docker compose build server
              docker compose stop server 2>/dev/null || true

              if ! release_port; then
                echo "ERROR: port 3001 is still busy, container would crash-loop."
                sudo ss -tlnp | grep 3001 || true
                exit 1
              fi
              echo "Port 3001 released"

              docker compose up -d server

              if wait_api; then
                echo "=== API is up (container) ==="

                # The API is published on loopback so that X-Forwarded-For
                # cannot be forged from outside. That is only safe while nginx
                # can still reach it, and this host's nginx config is not in
                # the repository, so verify through nginx rather than assuming.
                # If it cannot, fall back to a wide binding and say so: a
                # reachable site matters more than the header hardening.
                if ! curl -fsS -m 8 --resolve veheys.online:443:127.0.0.1 \
                     https://veheys.online/api/health >/dev/null 2>&1; then
                  echo "=== WARNING: nginx cannot reach the API on loopback ==="
                  echo "=== Reverting to a wide port binding ==="
                  sed -i 's|^      - "127.0.0.1:3001:3001"|      - "3001:3001"|' /opt/flex/docker-compose.yml
                  docker compose up -d server
                  if wait_api && curl -fsS -m 8 --resolve veheys.online:443:127.0.0.1 \
                       https://veheys.online/api/health >/dev/null 2>&1; then
                    echo "=== API reachable again; commit the fallback to the repo ==="
                    git -C /opt/flex commit -am "chore: widen the published API port, loopback broke nginx" || true
                    git -C /opt/flex push origin HEAD:main || true
                  else
                    echo "ERROR: API unreachable even on a wide binding."
                    exit 1
                  fi
                else
                  echo "=== nginx reaches the API on loopback ==="
                fi
              else
                echo "=== WARNING: container did not come up, falling back to the host ==="
                docker compose ps || true
                docker compose logs --tail 50 server || true
                docker compose stop server 2>/dev/null || true
                sleep 2

                cd /opt/flex/server
                start_host
                if ! wait_api; then
                  echo "ERROR: API is down in both modes."
                  sudo ss -tlnp | grep 3001 || true
                  screen -ls || true
                  exit 1
                fi
                echo "=== API is up (host fallback) ==="
              fi
            else
              echo "=== Compose plugin not available: deploying API on the host ==="
              echo "Install it for auto-restart:"
              echo "  sudo mkdir -p /usr/local/lib/docker/cli-plugins"
              echo "  sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose"
              echo "  sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose"

              start_host
              if ! wait_api; then
                echo "ERROR: API did not come up."
                sudo ss -tlnp | grep 3001 || true
                screen -ls || true
                exit 1
              fi
              echo "=== API is up (host) ==="
            fi

            phase "nginx security headers"
            echo "=== Applying security headers to the live vhost ==="
            # The live config is now known: xray terminates TLS on :443 and
            # forwards to nginx on 127.0.0.1:8080, so headers must be added to
            # that plain-HTTP server block - that is what puts them on the wire
            # for TLS clients. The script keeps a .flexbak beside the file and
            # gates on nginx -t, so it can be undone.
            bash scripts/nginx-security-headers.sh apply || \
              echo "WARNING: nginx header step reported a problem, continuing"

            # The config dump that found this is retired. It was published to
            # the web root, so it stayed readable by anyone after the deploy
            # that wrote it, describing the host's ports and processes. The
            # failure diagnostics remain, and are only written when something is
            # actually broken.
            sudo rm -f /var/www/html/_nginx.txt || true

            phase "nginx reload"
            echo "=== Reloading nginx ==="
            # Reload only. xray forwards :443 to nginx on 127.0.0.1:8080, and
            # restarting nginx drops that tunnel, which is somebody else's VPN.
            sudo systemctl reload nginx

            phase "done"
            echo "=== Deploy complete ==="
            # Durations per phase. Written to a file rather than the log because
            # the log cannot be read from here, and guessing which step dominates
            # is how a deploy ends up six minutes long with no explanation.
            {
              echo "deploy timings at $(date -u +%FT%TZ)"
              awk 'NR==1 { prev=$1; first=$1; next }
                   { printf "  %-40s %4ds\n", substr($0, index($0,$2)), $1-prev; prev=$1 }
                   END { printf "  %-40s %4ds\n", "TOTAL (script wall time)", prev-first }' /tmp/_phase.log
            } >/tmp/_timing.txt 2>&1 || true
            sudo cp /tmp/_timing.txt /var/www/html/_timing.txt 2>/dev/null || true