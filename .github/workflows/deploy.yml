name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: veheys.online
          username: flexdrrexar
          port: 8833
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Secrets are never stored in this repo. They are read on the VPS from
          # /opt/flex/server/.env, or from these GitHub secrets if set.
          envs: 'DATABASE_URL,JWT_SECRET'
          script: |
            export PATH=$PATH:/opt/flex/server/node_modules/.bin

            if [ -f /opt/flex/server/.env ]; then
              echo "=== Loading secrets from server/.env ==="
              set -a
              . /opt/flex/server/.env
              set +a
            fi

            if [ -z "$DATABASE_URL" ]; then
              echo "ERROR: DATABASE_URL is not set."
              echo "Create /opt/flex/server/.env with DATABASE_URL=... and JWT_SECRET=... (see server/.env.example),"
              echo "or add DATABASE_URL / JWT_SECRET as repository secrets."
              exit 1
            fi
            if [ -z "$JWT_SECRET" ]; then
              echo "ERROR: JWT_SECRET is not set (same fix as above)."
              exit 1
            fi

            echo "=== Pulling latest code ==="
            cd /opt/flex && git fetch origin && git reset --hard origin/main

            echo "=== Building server ==="
            cd /opt/flex/server
            npm install --silent
            npx prisma generate
            npx prisma db push --accept-data-loss
            npm run build

            echo "=== Building client ==="
            cd /opt/flex/client
            npm install --silent
            npm run build
            sudo cp -r dist/* /var/www/html/

            echo "=== Restarting server ==="
            screen -X -S flex-server quit 2>/dev/null || true
            screen -dmS flex-server bash -c 'cd /opt/flex/server && node dist/index.js'

            echo "=== Reloading nginx ==="
            sudo systemctl reload nginx || sudo systemctl start nginx

            echo "=== Deploy complete ==="
