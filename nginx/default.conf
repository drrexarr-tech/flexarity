server {
    listen 80;
    server_name veheys.online;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name veheys.online;

    # SSL certificates (get from Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # helmet в Express защищает только ответы /api, а index.html отдаёт nginx.
    # Без заголовков ниже внедрённый скрипт не встречает ни script-src, ни
    # connect-src, а токены лежат в localStorage этого же origin.
    # connect-src разрешает oauth.telegram.org — вход идёт через него.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://oauth.telegram.org; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # PWA service worker
    location /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed /;
    }

    # Static files
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest
    location /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # API proxy
    location /api {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
